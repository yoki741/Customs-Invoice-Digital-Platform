# ============================================================
# 報關發票(柬埔寨)數字化管理平台 — nginx 反代 + Header 认证示例
#
# 前提：
# 1. uvicorn 只监听127.0.0.1:8000（不能暴露到公网/局域网）
# 2. data/header_auth_secret 与下面的 X-Internal-Token 一致
#    （首次启动自动生成， cat data/header_auth_secret 查看）
# 3. 父系统登录后能提供「当前用户名」，经 nginx 注入 X-Remote-User
# ============================================================

# ---- 子路径挂载（推荐：invoice.example.com/invoice/）----
# server {
#     listen 443 ssl;
#     server_name invoice.example.com;
#
#     # 父系统 SSO 中间件处理登录后，$remote_user / $http_x_sso_user
#     # 等变量携带当前用户名（具体变量名以父系统为准）
#
#     location /invoice/ {
#         # 去掉 /invoice 前缀再转给 uvicorn（uvicorn 内部路径仍是 /invoices 等）
#         proxy_pass http://127.0.0.1:8000/;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#
#         # ---- Header 认证（方案 B 核心）----
#         # 共享密钥：与 data/header_auth_secret 一致
#         proxy_set_header X-Internal-Token  "替换成 data/header_auth_secret 的内容";
#         # 当前登录用户名（父系统 SSO 提供，变量名按实际情况改）
#         proxy_set_header X-Remote-User     $remote_user;
#         # 可选：角色提示，仅首次 JIT 开通时生效；已有账号以本系统为准
#         # proxy_set_header X-Remote-Role  $remote_user_role;
#     }
#
#     location /invoice/static/ {
#         proxy_pass http://127.0.0.1:8000/static/;
#         proxy_set_header Host $host;
#         expires 7d;
#     }
# }

# ---- 子域名挂载（更简单，无需处理路径前缀）----
server {
    listen 443 ssl;
    server_name invoice.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Internal-Token  "替换成 data/header_auth_secret 的内容";
        proxy_set_header X-Remote-User     $remote_user;
        # proxy_set_header X-Remote-Role  $remote_user_role;
    }

    # 上传 .xlsm 可能较大，放宽 client_max_body_size
    client_max_body_size 50m;
}
