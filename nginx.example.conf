# ============================================================
# 报关单数字化平台 — Nginx 反代示例（子路径挂载）
#
# 说明：生产环境由 DTD_nginx Portal 自动生成同等配置
#       （apps_registry/management/commands/generate_nginx_config.py），
#       本文件仅供独立部署或排查时参考。
#
# 要点：
# 1. 只用 rewrite 剥前缀，不能让上游自己处理 /customs-invoice；
# 2. 必须回传 X-Forwarded-Prefix，应用据此生成跳转与静态资源链接；
# 3. 身份头 Remote-* 只能由 Nginx 注入（先清空客户端自带的同名头）；
# 4. 应用侧 CUSTOMS_AUTH_MODE=sso 时未登录页面返回 303/401，
#    HTML location 用 error_page 401 转 /oauth2/start。
# ============================================================

server {
    listen 443 ssl;
    server_name ditupotal.dkthk.local;

    # ---- 静态资源：长缓存 ----
    location /customs-invoice/static/ {
        include /etc/nginx/snippets/proxy.conf;
        rewrite ^/customs-invoice/(.*)$ /$1 break;
        proxy_pass http://DKT_customs-invoice:8000;
        expires 7d;
    }

    # ---- API：未登录返回 401 JSON，不跳登录页 ----
    location ^~ /customs-invoice/api/ {
        include /etc/nginx/snippets/proxy.conf;

        # 清空客户端伪造的身份头，再由 auth_request 结果覆盖
        proxy_set_header Remote-Subject "";
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Display-Name "";

        auth_request /internal/application-authorize/customs-invoice;
        auth_request_set $subject $upstream_http_x_auth_request_subject;
        auth_request_set $user $upstream_http_x_auth_request_preferred_username;
        auth_request_set $groups $upstream_http_x_auth_request_groups;

        proxy_set_header Remote-Subject $subject;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Display-Name $user;
        proxy_set_header X-Forwarded-Prefix /customs-invoice;

        rewrite ^/customs-invoice/(.*)$ /$1 break;
        proxy_pass http://DKT_customs-invoice:8000;

        client_max_body_size 100m;
        proxy_read_timeout 600s;
    }

    # ---- 页面：未登录转统一登录 ----
    location /customs-invoice/ {
        include /etc/nginx/snippets/proxy.conf;

        proxy_set_header Remote-Subject "";
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Display-Name "";

        auth_request /internal/application-authorize/customs-invoice;
        auth_request_set $subject $upstream_http_x_auth_request_subject;
        auth_request_set $user $upstream_http_x_auth_request_preferred_username;
        auth_request_set $groups $upstream_http_x_auth_request_groups;

        proxy_set_header Remote-Subject $subject;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Display-Name $user;
        proxy_set_header X-Forwarded-Prefix /customs-invoice;

        error_page 401 = /oauth2/start;
        error_page 403 = @customs_invoice_forbidden;

        rewrite ^/customs-invoice/(.*)$ /$1 break;
        proxy_pass http://DKT_customs-invoice:8000;

        client_max_body_size 100m;
        proxy_read_timeout 600s;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /customs-invoice {
        return 301 /customs-invoice/;
    }

    location @customs_invoice_forbidden {
        internal;
        default_type text/html;
        return 403 '无权限访问「报关单数字化平台」，请联系管理员加入 apps/customs-invoice 组。';
    }

    # auth_request 子请求由 Portal 提供（此处仅示意）
    location = /internal/application-authorize/customs-invoice {
        internal;
        proxy_pass http://DKT_kc_portal:8001/internal/application-authorize/customs-invoice;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host portal;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Application-Slug customs-invoice;
    }
}
