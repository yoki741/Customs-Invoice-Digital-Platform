{% extends "base.html" %}
{% block title %}登录 - 報關發票數字化管理平台{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block heading %}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <div class="logo mx-auto mb-2" style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#1e5eff,#6b8bff);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px">報</div>
          <h4 class="mb-0">報關發票(柬埔寨)</h4>
          <p class="text-muted small mb-0">Customs Invoice Digital Platform</p>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label">账号</label>
            <input class="form-control" name="username" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input class="form-control" type="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100">登录</button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3 mb-0">忘记账号请联系系统管理员</p>
  </div>
</div>
{% endblock %}
